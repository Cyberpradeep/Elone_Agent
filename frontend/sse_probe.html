<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SSE close probe</title></head><body>
<pre id="out">running…</pre>
<script>
// Reproduces the browser's native behaviour when the server ends an SSE
// response, and verifies the guard used in app.js distinguishes it from a
// real failure.
const log = [];
let streamFinished = false;
let spurious = 0, suppressed = 0;

const es = new EventSource("/api/tickets/x/stream");

function endStream(ev) { streamFinished = true; es.close(); log.push("handled " + ev); }

es.addEventListener("node", () => log.push("node"));
es.addEventListener("done", (e) => endStream("done"));
es.addEventListener("error", (e) => {
  const hasData = !!e.data;
  if (!hasData && streamFinished) { suppressed++; log.push("error(native) SUPPRESSED readyState=" + es.readyState); return; }
  if (!hasData) { spurious++; log.push("error(native) REPORTED readyState=" + es.readyState); es.close(); return; }
  log.push("error(payload) REPORTED");
});

setTimeout(() => {
  window.__result = { log, suppressed, reported: spurious, readyState: es.readyState };
  document.getElementById("out").textContent = JSON.stringify(window.__result, null, 1);
}, 2500);
</script>
</body></html>

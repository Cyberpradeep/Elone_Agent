<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elone SOP Governance Hub</title>
  <meta name="description" content="Ingest raw SOP documents, review and approve them with separation of duties, and publish verified OKF playbooks to downstream agents.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236d7cf5'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap">
  <!-- Cache-busting: browsers keep imported ES modules for days. Bump v= below whenever any JS/CSS changes. -->
  <script type="importmap">
  {
    "imports": {
      "./js/auth.js": "./js/auth.js?v=20261112c",
      "./js/api.js": "./js/api.js?v=20261112c",
      "./js/ui.js": "./js/ui.js?v=20261112c",
      "./js/charts.js": "./js/charts.js?v=20261112c",
      "./js/progress.js": "./js/progress.js?v=20261112d",
      "./js/views/overview.js": "./js/views/overview.js?v=20261112c",
      "./js/views/playbooks.js": "./js/views/playbooks.js?v=20261112c",
      "./js/views/review.js": "./js/views/review.js?v=20261112c",
      "./js/views/review-task.js": "./js/views/review-task.js?v=20261112c",
      "./js/views/catalog.js": "./js/views/catalog.js?v=20261112c",
      "./js/views/ingestion.js": "./js/views/ingestion.js?v=20261112c",
      "./js/views/tools.js": "./js/views/tools.js?v=20261112c",
      "./js/views/telemetry.js": "./js/views/telemetry.js?v=20261112c",
      "./js/views/audit.js": "./js/views/audit.js?v=20261112c",
      "./js/views/security.js": "./js/views/security.js?v=20261112c",
      "./js/views/settings.js": "./js/views/settings.js?v=20261112c"
    }
  }
  </script>
  <link rel="stylesheet" href="./css/style.css?v=20261112c">
  <link rel="stylesheet" href="./css/components.css?v=20261112c">

  <script>
    // Apply the saved (or OS) theme before first paint to avoid a flash.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('elone-theme'));
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* keep default */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#viewport-container">Skip to content</a>

  <div id="login-screen" hidden></div>

  <div id="app-container" hidden>
    <aside id="sidebar" aria-label="Primary">
      <div class="brand-section">
        <div class="brand-logo-badge" aria-hidden="true">E</div>
        <div class="brand-info">
          <h1>Elone <span class="badge-tag">OKF</span></h1>
          <p>SOP Governance Hub</p>
        </div>
      </div>

      <nav class="nav-menu" id="nav-menu" aria-label="Main navigation"><!-- built by app.js --></nav>

      <div class="sidebar-footer">
        <div id="sidebar-user"></div>
        <div class="system-status-indicator" id="api-status" role="status" aria-live="polite">
          <span class="status-left"><span class="status-dot-pulse" id="api-dot"></span><span id="api-label">Connecting…</span></span>
          <span class="status-right" id="api-latency"></span>
        </div>
      </div>
    </aside>

    <main id="main-content">
      <header id="header-bar">
        <div class="header-left">
          <button class="btn btn-outline btn-icon-only" id="nav-toggle" aria-label="Toggle navigation" data-action="toggle-nav"></button>
          <div class="page-title-box">
            <h2 id="page-title">Dashboard</h2>
            <p id="page-subtitle"></p>
          </div>
        </div>

        <div class="header-right">
          <div class="search-wrapper">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="global-search" class="search-input" placeholder="Search playbooks…" aria-label="Search playbooks" autocomplete="off">
            <kbd aria-hidden="true">/</kbd>
          </div>
          <button class="btn btn-outline btn-icon-only" id="theme-toggle" data-action="toggle-theme" aria-label="Toggle dark / light theme" title="Toggle theme"></button>
          <a class="btn btn-primary" href="#/ingestion" id="header-cta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span class="btn-label">Ingest SOP</span>
          </a>
        </div>
      </header>

      <section id="viewport-container" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>

  <div id="global-modal" class="modal-overlay"></div>
  <div id="toast-container" aria-live="polite"></div>

  <noscript><p style="padding:24px">This dashboard needs JavaScript enabled.</p></noscript>
  <script type="module" src="./js/app.js?v=20261112c"></script>
</body>
</html>
